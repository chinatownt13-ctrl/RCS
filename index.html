<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>RCS 远控中心</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c30; --panel2:#18233c; --line:#24324e;
  --txt:#e8eefc; --mut:#8fa0c4; --acc:#3d8bff; --acc2:#00c2ff;
  --ok:#25d366; --warn:#ffb020; --danger:#ff4d5e;
  --r:18px; --r-sm:12px;
  --pad:16px; --nav-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px; user-select:none; -webkit-user-select:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2b3a5c;border-radius:3px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px var(--pad);background:rgba(11,18,32,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
header .logo{display:flex;align-items:center;gap:10px;flex:1}
.brand-dot{width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-size:18px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:11px;color:var(--mut);margin-top:2px}
.chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
  color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--txt);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--warn)}
#menuBtn{width:44px;height:44px;flex:none;border:none;background:var(--panel2);
  border:1px solid var(--line);border-radius:14px;color:var(--txt);font-size:20px}

/* ---------- 主区域 ---------- */
main{padding:var(--pad)}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--mut);font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;justify-content:space-between}
.card h2 .act{font-size:12px;color:var(--acc);text-transform:none;letter-spacing:0;font-weight:600}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:16px;text-align:center;position:relative;overflow:hidden}
.metric .icon{font-size:22px}
.metric .val{font-size:28px;font-weight:800;margin:6px 0 2px;line-height:1}
.metric .val small{font-size:12px;color:var(--mut);font-weight:600;margin-left:2px}
.metric .lbl{font-size:12px;color:var(--mut)}
.bar{height:6px;background:#0d1830;border-radius:4px;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.bar.danger>i{background:linear-gradient(90deg,var(--warn),var(--danger))}
.netval font{font-weight:800}

canvas.chart{width:100%;height:150px;display:block;margin-top:4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);justify-content:center;margin-top:4px}

/* per-cpu */
.pcpu{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pcpu .p{flex:1 1 34px;min-width:34px;text-align:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:6px 3px}
.pcpu .p i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-bottom:4px}
.pcpu .p b{font-size:12px;font-weight:700}

/* 系统信息 */
.info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--mut)}
.info-row .v{text-align:right;font-weight:600;word-break:break-all}

/* ---------- 终端 ---------- */
.term-box{background:#0a0f1c;border:1px solid var(--line);border-radius:var(--r);
  height:52vh;min-height:300px;overflow:auto;padding:14px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
  font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.term-box .cmd{color:#7ee1ff;font-weight:600}
.term-box .out{color:#cfe0ff}
.term-box .err{color:#ff9aa4}
.term-box .sys{color:#6b7ba3}
.term-box::-webkit-scrollbar{width:8px}
.term-box::-webkit-scrollbar-thumb{background:#22314f}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.quick button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:12px 16px;border-radius:12px;font-size:14px;min-width:76px}
.cmd-row{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.cmd-row input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:14px;font-size:16px;padding:16px;min-height:54px;outline:none}
.cmd-row input:focus{border-color:var(--acc)}
.cmd-row button{width:58px;height:54px;flex:none;border:none;border-radius:14px;font-size:22px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}

/* ---------- 文件 ---------- */
.bread{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 0 12px;white-space:nowrap}
.bread .seg{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;
  border-radius:12px;font-size:14px;color:var(--txt)}
.bread .seg.dim{color:var(--mut)}
.file-list{list-style:none;margin:0;padding:0}
.file-list li{display:flex;align-items:center;gap:14px;padding:15px 10px;min-height:60px;
  border-bottom:1px solid var(--line);border-radius:12px;cursor:pointer}
.file-list li:active{background:var(--panel2)}
.file-list .f-ico{font-size:24px;width:30px;text-align:center;flex:none}
.file-list .f-name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list .f-name.dir{color:var(--acc);font-weight:600}
.file-list .f-meta{font-size:12px;color:var(--mut)}
.pathbox{display:flex;gap:8px;margin-bottom:10px}
.pathbox input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:12px 14px;border-radius:12px;font-size:14px;outline:none;min-height:48px}
.pathbox button{flex:none;width:52px;border:none;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);font-size:18px}

/* ---------- 进程 ---------- */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:14px;padding:14px 16px;font-size:16px;outline:none;min-height:54px}
.search-row button{width:54px;height:54px;border:none;border-radius:14px;font-size:20px;
  background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.proc-list{list-style:none;margin:0;padding:0}
.proc-list li{padding:14px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.proc-meta{flex:1;min-width:0}
.proc-meta .nm{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc-meta .info{font-size:12px;color:var(--mut);margin-top:3px}
.proc-bar{width:70px;height:5px;background:#0d1830;border-radius:3px;overflow:hidden;flex:none}
.proc-bar>i{display:block;height:100%;background:var(--acc)}
.kill-btn{flex:none;width:52px;height:52px;border:none;border-radius:12px;font-size:16px;
  background:var(--danger);color:#fff;opacity:.9}

/* ---------- 截图 ---------- */
.shot-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.shot-img{width:100%;background:#050810;border:1px solid var(--line);border-radius:var(--r);
  min-height:220px;display:grid;place-items:center;overflow:hidden}
.shot-img img{width:100%;display:block}
.shot-ph{color:var(--mut);font-size:14px;text-align:center;padding:30px}
.big-btn{width:100%;min-height:60px;border:none;border-radius:16px;font-size:17px;font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.big-btn:active{transform:scale(.98)}

/* ---------- 电源 ---------- */
.power-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.power-grid button{min-height:92px;border:1px solid var(--line);border-radius:16px;
  background:var(--panel2);color:var(--txt);font-size:16px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.power-grid button .big{font-size:26px}
.power-grid button:active{transform:scale(.97)}
.power-grid button.danger{background:#2a1119;border-color:#5c2030;color:#ff8f9b}
.pw-note{font-size:12px;color:var(--mut);text-align:center;margin-top:6px;line-height:1.6}

/* ---------- 底部导航 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:rgba(11,18,32,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:none;color:var(--mut);flex:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;
  min-width:56px;padding-top:6px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--acc)}
nav button.on .ic{transform:translateY(-1px)}

/* ---------- 启动/锁屏覆盖层 ---------- */
#overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px}
#overlay.hide{display:none}
.lock-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:26px;padding:30px 24px;text-align:center}
.lock-card .lg{font-size:40px;margin-bottom:10px}
.lock-card h2{font-size:22px;margin:0 0 6px}
.lock-card p{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.6}
.lock-card input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:16px;padding:18px;font-size:18px;text-align:center;outline:none;min-height:58px;margin-bottom:14px;letter-spacing:2px}
.lock-card input:focus{border-color:var(--acc)}
.lock-card .go{width:100%;height:58px;border:none;border-radius:16px;font-size:18px;font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.lock-card .err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px}

/* toast */
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-100px);
  z-index:200;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:14px 22px;border-radius:14px;font-size:14px;transition:transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:#2a1119;border-color:#5c2030;color:#ff8f9b}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:120;display:none;
  align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:19px;margin:0 0 8px}
.sheet .desc{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.6}
.sheet .row{display:flex;gap:12px}
.sheet button{flex:1;height:56px;border-radius:16px;font-size:16px;font-weight:700;border:none}
.sheet .cancel{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.sheet .danger{background:var(--danger);color:#fff}

@media(min-width:760px){
  main{max-width:780px;margin:0 auto}
  .shot-img{max-width:600px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="brand-dot">🖥️</div>
    <div>
      <h1>RCS 远控中心</h1>
      <div class="sub" id="hostLabel">连接中…</div>
    </div>
  </div>
  <div class="chip"><span class="dot" id="statDot"></span><span id="statTxt">连接中</span></div>
  <button id="menuBtn" title="菜单">⚙</button>
</header>

<main>
  <!-- 监控 -->
  <section class="page" id="p-monitor">
    <div class="card">
      <h2>实时资源 <span class="act" id="upTime"></span></h2>
      <div class="grid">
        <div class="metric">
          <div class="icon">🧠</div>
          <div class="val"><span id="mCpu">--</span><small>%</small></div>
          <div class="lbl">CPU 使用率</div>
          <div class="bar" id="barCpu"><i></i></div>
        </div>
        <div class="metric">
          <div class="icon">📌</div>
          <div class="val"><span id="mMem">--</span><small>%</small></div>
          <div class="lbl">内存使用率</div>
          <div class="bar" id="barMem"><i></i></div>
        </div>
        <div class="metric">
          <div class="icon">💾</div>
          <div class="val"><span id="mDisk">--</span><small>%</small></div>
          <div class="lbl">磁盘使用率</div>
          <div class="bar danger" id="barDisk"><i></i></div>
        </div>
        <div class="metric">
          <div class="icon" id="battIcon">🔋</div>
          <div class="val"><span id="mBatt">--</span></div>
          <div class="lbl" id="battLbl">电池</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>CPU 趋势 <span class="act">近60秒</span></h2>
      <canvas class="chart" id="cpuChart"></canvas>
      <div class="legend"><span>CPU</span><span>内存</span></div>
    </div>

    <div class="card">
      <h2>网络吞吐 <span class="act">近60秒</span></h2>
      <canvas class="chart" id="netChart"></canvas>
      <div class="legend"><span style="color:#3d8bff">▲ 上行</span><span style="color:#00c2ff">▼ 下行</span></div>
    </div>

    <div class="card">
      <h2>核心负载 <span class="act" id="coreCount"></span></h2>
      <div class="pcpu" id="pcpu"></div>
    </div>

    <div class="card">
      <h2>系统信息</h2>
      <div id="sysInfo"></div>
    </div>
  </section>

  <!-- 终端 -->
  <section class="page" id="p-term">
    <div class="card" style="padding:0;overflow:hidden;background:transparent;border:none">
      <div class="term-box" id="termBox">
        <div class="sys">RCS 终端就绪。输入命令后回车执行。</div>
      </div>
      <div class="quick" id="quickBtns"></div>
    </div>
    <div class="cmd-row">
      <input id="cmdInput" placeholder="输入命令…" autocomplete="off" autocapitalize="off" autocorrect="off">
      <button id="cmdGo" title="执行">➤</button>
    </div>
  </section>

  <!-- 文件 -->
  <section class="page" id="p-files">
    <div class="card">
      <div class="pathbox">
        <input id="pathInput" placeholder="路径">
        <button id="pathGo" title="跳转">→</button>
      </div>
      <div class="bread" id="bread"></div>
      <ul class="file-list" id="fileList"></ul>
    </div>
  </section>

  <!-- 进程 -->
  <section class="page" id="p-proc">
    <div class="card">
      <div class="search-row">
        <input id="procSearch" placeholder="搜索进程名…" autocomplete="off">
        <button id="procGo" title="搜索">🔍</button>
      </div>
      <ul class="proc-list" id="procList"></ul>
      <div id="procEmpty" style="color:var(--mut);text-align:center;padding:30px;display:none">无匹配进程</div>
    </div>
  </section>

  <!-- 截图 -->
  <section class="page" id="p-shot">
    <div class="card">
      <div class="shot-wrap">
        <div class="shot-img" id="shotBox"><div class="shot-ph">点击下方按钮截取远程屏幕</div></div>
        <button class="big-btn" id="shotGo">📸 截图</button>
      </div>
    </div>
  </section>

  <!-- 电源 -->
  <section class="page" id="p-power">
    <div class="card">
      <h2>电源控制</h2>
      <div class="power-grid">
        <button data-a="lock"><span class="big">🔒</span>锁定</button>
        <button data-a="logout"><span class="big">🚪</span>注销</button>
        <button data-a="reboot" class="danger"><span class="big">🔄</span>重启</button>
        <button data-a="shutdown" class="danger"><span class="big">⏻</span>关机</button>
      </div>
      <p class="pw-note">⚠️ 重启/关机有副作用，操作前请确认设备上工作已保存。锁定通常无害。</p>
    </div>
  </section>
</main>

<nav>
  <button data-tab="monitor" class="on"><span class="ic">📊</span>监控</button>
  <button data-tab="term"><span class="ic">⌨️</span>终端</button>
  <button data-tab="files"><span class="ic">📁</span>文件</button>
  <button data-tab="proc"><span class="ic">📋</span>进程</button>
  <button data-tab="shot"><span class="ic">📸</span>截图</button>
  <button data-tab="power"><span class="ic">⏻</span>电源</button>
</nav>

<div id="overlay">
  <div class="lock-card">
    <div class="lg">🔑</div>
    <h2>连接远程设备</h2>
    <div class="err" id="lockErr"></div>
    <input id="tokenInput" type="password" placeholder="" autocomplete="off" autofocus>
    <button class="go" id="tokenGo">连接</button>
  </div>
</div>

<div id="toast"></div>

<div class="modal-mask" id="modalMask">
  <div class="sheet">
    <h3 id="modalTitle">确认操作</h3>
    <p class="desc" id="modalDesc">确定要继续吗？</p>
    <div class="row">
      <button class="cancel" id="modalCancel">取消</button>
      <button class="danger" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const fmt = (n,d=1)=> (+n).toFixed(d);

/* ---------- 状态 ---------- */
const S = {
  token: localStorage.getItem("rcs_token") || "",
  host: localStorage.getItem("rcs_host") || location.host,
  tab: "monitor",
  curDir: "",
  home: "",
  histH: { cpu:[], mem:[], netUp:[], netDown:[] },
  MAXH: 60,
  es: null,
  connected: false,
  procTimer: null,
  curPathParts: [],
};

/* ---------- 通用 API ---------- */
function fail(msg){ toast(msg, true); }
function toast(t, err){
  const el = $("#toast");
  el.textContent = t; el.className = err ? "show err" : "show";
  clearTimeout(el._t); el._t = setTimeout(()=>el.className="", 2600);
}
async function api(path, opts={}){
  // 令牌走 URL 查询串，兼容中文等任意字符，避免非 ASCII 请求头编码问题
  const sep = path.includes("?") ? "&" : "?";
  const url = path + sep + "token=" + encodeURIComponent(S.token);
  const headers = Object.assign({}, opts.headers||{});
  if(opts.body && typeof opts.body !== "string"){ opts.body = JSON.stringify(opts.body); headers["Content-Type"]="application/json"; }
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  const ct = r.headers.get("content-type")||"";
  let data;
  if(ct.includes("json")) data = await r.json(); else data = await r.text();
  if(!r.ok){ throw new Error(data && data.error || ("HTTP "+r.status)); }
  return data;
}

/* ---------- 连接 / SSE ---------- */
function connectStream(){
  if(S.es) S.es.close();
  const url = "/stream?token=" + encodeURIComponent(S.token);
  S.es = new EventSource(url);
  S.es.onopen = ()=>{ setStatus(true); };
  S.es.onmessage = e=>{
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(!m.ok) return;
    if(m.type === "init"){
      S.host = m.hostname; renderSys(m);
    } else if(m.type === "stats"){
      updateMetrics(m); pushHist(m); drawCharts();
    }
    if(!S.connected){ S.connected = true; afterConnect(); }
  };
  S.es.onerror = ()=>{ setStatus(false); };
}
function setStatus(ok){
  S.connected = ok;
  $("#statDot").className = "dot " + (ok?"on":"off");
  $("#statTxt").textContent = ok ? "在线" : "重连中";
}

/* ---------- 鉴权流程 ---------- */
function showLock(err){
  $("#overlay").classList.remove("hide");
  $("#lockErr").textContent = err || "";
}
function hideLock(){ $("#overlay").classList.add("hide"); }
async function tryConnect(showFail){
  if(!S.token) return showLock();
  try{
    const p = await api("/api/ping");
    if(!p.ok) throw new Error("无效响应");
    localStorage.setItem("rcs_token", S.token);
    localStorage.setItem("rcs_host", location.host);
    hideLock(); connectStream();
  }catch(e){
    if(showFail) showLock("连接失败，请重试");
  }
}

/* ---------- 标签切换 + 左右滑动 ---------- */
const TAB_ORDER = ["monitor","term","files","proc","shot","power"];
function switchTab(tab, silent){
  S.tab = tab;
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  $$(".page").forEach(p => p.classList.toggle("active", p.id==="p-"+tab));
  if(!silent){
    if(tab==="monitor") drawCharts();
    if(tab==="proc") refreshProcs();
    if(tab==="files"){ if(!S.curDir) openDir("", true); else openDir(S.curDir, false); }
    if(tab==="term") $("#cmdInput").focus();
  }
}
let touchStartX = 0;
document.addEventListener("touchstart", e=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) < 70) return;
  const cur = TAB_ORDER.indexOf(S.tab);
  const next = dx < 0 ? Math.min(TAB_ORDER.length-1, cur+1) : Math.max(0, cur-1);
  if(next !== cur) switchTab(TAB_ORDER[next]);
}, {passive:true});

/* ---------- 监控 ---------- */
function renderSys(m){
  $("#hostLabel").textContent = m.hostname + " · " + m.os.split(" ")[0];
  $("#coreCount").textContent = "共 " + (m.cpuLogical||"?") + " 核";
  const rows = [
    ["主机名", m.hostname], ["操作系统", m.os], ["架构", m.machine],
    ["CPU", m.cpuModel || "-"], ["核心数", (m.cpuLogical||"-")+" 逻辑 / "+(m.cpuPhysical||"-")+" 物理"],
    ["Python", m.python],
  ];
  $("#sysInfo").innerHTML = rows.map(r=>`<div class="info-row"><span class="k">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join("");
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function updateMetrics(m){
  setVal($("#mCpu"), fmt(m.cpu)); setBar($("#barCpu"), m.cpu);
  setVal($("#mMem"), fmt(m.mem)); setBar($("#barMem"), m.mem);
  setVal($("#mDisk"), fmt(m.disk)); setBar($("#barDisk"), m.disk);
  // 电池
  if(m.battery){
    $("#mBatt").textContent = fmt(m.battery.percent);
    $("#battLbl").textContent = m.battery.plugged ? "电池 · 充电中" : "电池";
    $("#battIcon").textContent = m.battery.plugged ? "🔌" : "🔋";
  }else{
    $("#mBatt").textContent = "--"; $("#battLbl").textContent = "无电池 / 台式机";
    $("#battIcon").textContent = "🔌";
  }
  // 网络数值放在图表 legend, 此处更新 upTime
  if(m.uptime){ $("#upTime").textContent = fmtUptime(m.uptime); }
  // 每核
  if(m.perCpu && m.perCpu.length){
    $("#pcpu").innerHTML = m.perCpu.map((c,i)=>`<div class="p"><i>C${i}</i><b>${fmt(c)}</b></div>`).join("");
  }
}
function setVal(el,t){ if(el) el.textContent = t; }
function setBar(box,p){
  const i = box.querySelector("i");
  i.style.width = Math.min(100,Math.max(0,p)) + "%";
}
function fmtUptime(s){
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d>0?`${d}天${h}小时`:`${h}小时${m}分`;
}
function pushHist(m){
  const H=S.histH;
  H.cpu.push(m.cpu); H.mem.push(m.mem);
  H.netUp.push(m.netUp); H.netDown.push(m.netDown);
  if(H.cpu.length>S.MAXH){ H.cpu.shift();H.mem.shift();H.netUp.shift();H.netDown.shift(); }
}
function drawCharts(){
  drawLineChart($("#cpuChart"), [S.histH.cpu, S.histH.mem], ["#3d8bff","#00c2ff"], 0, 100, true);
  drawNetChart($("#netChart"));
}
function setupCanvas(cv){
  const dpr = window.devicePixelRatio||1;
  const rect = cv.getBoundingClientRect();
  if(rect.width===0) return {w:0,h:0,dpr};
  cv.width = Math.round(rect.width*dpr); cv.height = Math.round(rect.height*dpr);
  const ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);
  return {w:rect.width,h:rect.height,dpr,ctx};
}
function drawNetChart(cv){
  const c = setupCanvas(cv); if(!c.w) return;
  const ctx=c.ctx;
  const maxV = Math.max(10, ...S.histH.netUp, ...S.histH.netDown);
  drawSeries(ctx,c.w,c.h,S.histH.netUp,"#3d8bff",0,maxV,true);
  drawSeries(ctx,c.w,c.h,S.histH.netDown,"#00c2ff",0,maxV,false);
  // 数值
  const up = S.histH.netUp[S.histH.netUp.length-1]||0;
  const dn = S.histH.netDown[S.histH.netDown.length-1]||0;
  ctx.fillStyle="#8fa0c4"; ctx.font="11px sans-serif"; ctx.textAlign="center";
  ctx.fillText("↑ "+fmtSpeed(up)+"   ↓ "+fmtSpeed(dn), c.w/2, c.h-8);
}
function fmtSpeed(b){ return b>=1048576?fmt(b/1048576,1)+"MB/s": b>=1024?fmt(b/1024,0)+"KB/s": b+"B/s"; }
function drawLineChart(cv, series, colors, min, max, fill){
  const c = setupCanvas(cv); if(!c.w) return;
  series.forEach((s,i)=> drawSeries(c.ctx,c.w,c.h,s,colors[i],min,max,fill));
}
function drawSeries(ctx,w,h,data,color,min,max,fill){
  if(!data || data.length<2) return;
  ctx.save();
  const pad=6;
  const x=i=> pad + (w-pad*2)*(i/(data.length-1));
  const y=v=> h-pad - (h-pad*2)*(((+v)-min)/((max-min)||1));
  // 水平网格
  ctx.strokeStyle="rgba(255,255,255,.05)"; ctx.lineWidth=1;
  for(let g=0;g<4;g++){ const gy=h-pad-(h-pad*2)*(g/3); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }
  // 折线
  ctx.beginPath();
  data.forEach((v,i)=>{ const px=x(i), py=y(v); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); });
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  // 渐变填充(仅 CPU/内存图)
  if(fill){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, colorA(color,.30)); g.addColorStop(1, colorA(color,0));
    ctx.lineTo(x(data.length-1),h-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  }
  ctx.restore();
}
function colorA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ---------- 终端 ---------- */
var IS_WIN = !!(navigator.platform && /Win/i.test(navigator.platform));
const quickCmds = [
  ["信息", "systeminfo"], ["目录", IS_WIN?"dir":"ls -la"],
  ["IP", IS_WIN?"ipconfig":"ip addr"], ["网络", IS_WIN?"ping 127.0.0.1 -n 4":"ping -c 4 127.0.0.1"],
  ["环境", IS_WIN?"set":"env"], ["日期", "date"],
];
function renderQuick(){
  $("#quickBtns").innerHTML = quickCmds.map(q=>`<button data-c="${esc(q[1])}">${q[0]}</button>`).join("");
}
function termLine(text, cls){
  const box=$("#termBox"); const div=document.createElement("div");
  div.className=cls||"out"; div.textContent=text; box.appendChild(div); box.scrollTop=box.scrollHeight;
}
async function execCmd(cmd){
  if(!cmd.trim()) return;
  termLine("$ " + cmd, "cmd");
  try{
    const d = await api("/api/exec", {method:"POST", body:{cmd, cwd:S.curDir}});
    if(d.ok){
      if(d.stdout) termLine(d.stdout, "out");
      if(d.stderr) termLine(d.stderr, "err");
      termLine("[退出码: "+d.code+"]", "sys");
      if(!S.curDir && d.cwd) S.curDir = d.cwd;
    }else{ termLine(d.error||"执行失败", "err"); }
  }catch(e){ termLine(e.message, "err"); }
}

/* ---------- 文件 ---------- */
async function openDir(path, push=true){
  try{
    const d = await api("/api/files?path=" + encodeURIComponent(path||""));
    if(!d.ok){ toast(d.error||"无法打开", true); return; }
    S.curDir = d.path; S.home = d.home;
    $("#pathInput").value = d.path;
    renderBread(d.path);
    S.curPathParts = d.path.split(/[\\/]/).filter(Boolean);
    renderFiles(d);
  }catch(e){ toast(e.message, true); }
}
function renderBread(path){
  const el = $("#bread"); el.innerHTML="";
  const dim = t => { const s=document.createElement("span"); s.className="seg dim"; s.textContent=t; el.appendChild(s); return s; };
  const seg = (t,p) => { const s=document.createElement("span"); s.className="seg"; s.textContent=t; s.onclick=()=>openDir(p,false); el.appendChild(s); return s; };
  const sep = () => dim("›");
  const posix = path.startsWith("/");
  const parts = path.split(/[\\/]/).filter(Boolean);

  // 首页按钮
  seg("🏠", S.home||"");

  if(posix){
    let acc = "/";
    if(parts.length===0){ sep(); dim("/"); return; }
    parts.forEach((p,i)=>{
      acc = acc==="/" ? "/"+p : acc.replace(/\/$/,"")+"/"+p;
      sep();
      if(i===parts.length-1) dim(p); else seg(p, acc);
    });
  } else {
    // Windows 盘符路径
    if(parts.length===0){ return; }
    const drive = parts[0] + "\\";
    sep(); seg(parts[0]+":", drive);
    let acc = drive;
    for(let i=1;i<parts.length;i++){
      acc = acc.replace(/[\\/]$/,"") + "\\" + parts[i];
      sep();
      if(i===parts.length-1) dim(parts[i]); else seg(parts[i], acc);
    }
  }
}
function renderFiles(d){
  const list=$("#fileList"); list.innerHTML="";
  if(d.parent && d.path!==d.parent && d.path!==d.home && S.curDir!==d.home){
    // 提供返回上级
    const li=document.createElement("li");
    li.innerHTML=`<span class="f-ico">↩️</span><div><div class="f-name dir">返回上级</div><div class="f-meta">..</div></div>`;
    li.onclick=()=>openDir(d.parent,false);
    list.appendChild(li);
  }
  d.entries.forEach(e=>{
    const li=document.createElement("li");
    const ico = e.isDir ? "📁" : (isImg(e.name)?"🖼️":"📄");
    li.innerHTML=`<span class="f-ico">${ico}</span>` +
      `<div style="flex:1;min-width:0"><div class="f-name ${e.isDir?'dir':''}">${esc(e.name)}</div>` +
      `<div class="f-meta">${e.isDir?'目录':fmtSize(e.size)} · ${fmtDate(e.mtime)}</div></div>`;
    li.onclick=()=>{ if(e.isDir) openDir(joinPath(S.curDir,e.name),false); else toast("文件预览功能即将上线"); };
    list.appendChild(li);
  });
}
function joinPath(a,b){ return a.endsWith("/")||a.endsWith("\\") ? a+b : a+"/"+b; }
function fmtSize(s){ if(s<1024) return s+"B"; if(s<1048576) return fmt(s/1024,1)+"KB"; if(s<1073741824) return fmt(s/1048576,1)+"MB"; return fmt(s/1073741824,1)+"GB"; }
function fmtDate(t){ if(!t) return "-"; const d=new Date(t*1000); return d.toLocaleString(); }
function isImg(n){ return /\.(png|jpe?g|gif|bmp|webp)$/i.test(n); }

/* ---------- 进程 ---------- */
async function refreshProcs(){
  const q = $("#procSearch").value.trim();
  try{
    const d = await api("/api/processes?q=" + encodeURIComponent(q||""));
    if(!d.ok){ toast(d.error||"获取失败", true); return; }
    renderProcs(d.procs);
  }catch(e){ toast(e.message, true); }
}
function renderProcs(procs){
  const list=$("#procList"); list.innerHTML="";
  $("#procEmpty").style.display = procs.length? "none":"block";
  procs.forEach(p=>{
    const li=document.createElement("li");
    li.innerHTML=`<div class="proc-meta"><div class="nm">${esc(p.name)}</div>`+
      `<div class="info">PID ${p.pid} · ${fmt(p.mem)}%内存${p.user?" · "+esc(p.user):""}</div></div>`+
      `<div class="proc-bar"><i style="width:${Math.min(100,p.cpu)}%"></i></div>`+
      `<div style="width:38px;text-align:right;font-size:12px;color:var(--mut)">${fmt(p.cpu)}%</div>`+
      `<button class="kill-btn" data-pid="${p.pid}" data-name="${esc(p.name)}">✕</button>`;
    li.querySelector(".kill-btn").onclick=(ev)=>{ ev.stopPropagation(); confirmKill(p); };
    list.appendChild(li);
  });
}
function confirmKill(p){
  showModal("结束进程", `确定要结束 “${p.name}” (PID ${p.pid}) 吗？`, async()=>{
    try{
      const d = await api("/api/process/kill", {method:"POST", body:{pid:p.pid}});
      if(d.ok){ toast("已结束 "+p.name); refreshProcs(); } else toast(d.error||"失败", true);
    }catch(e){ toast(e.message, true); }
  });
}

/* ---------- 截图 ---------- */
async function takeShot(){
  const box=$("#shotBox");
  box.innerHTML='<div class="shot-ph">截取中…</div>';
  try{
    const d = await api("/api/screenshot");
    if(!d.ok) throw new Error(d.error||"截图失败");
    const img=new Image();
    img.onload=()=>{ box.innerHTML=""; img.alt="远程截图"; box.appendChild(img); };
    img.onerror=()=>{ box.innerHTML='<div class="shot-ph">图片加载失败</div>'; };
    img.src = "data:image/jpeg;base64," + d.image;
  }catch(e){ box.innerHTML='<div class="shot-ph">'+esc(e.message)+'</div>'; }
}

/* ---------- 电源 ---------- */
const POWER_TXT = {
  lock:["锁定设备","仅锁定屏幕，不会关闭会话或中断程序，可安全操作。"],
  logout:["注销当前用户","将结束当前账户的所有会话，未保存内容会丢失。"],
  reboot:["重启设备","系统将立即重启，所有未保存工作会丢失。"],
  shutdown:["关机","系统将关闭电源，此操作不可逆。"],
};
function powerClick(action){
  const [t,d] = POWER_TXT[action] || ["确认操作","确定继续吗？"];
  showModal(t, d, async()=>{
    try{
      const r = await api("/api/power", {method:"POST", body:{action}});
      if(r.ok) toast("指令已发送"); else toast(r.error||"发送失败", true);
    }catch(e){ toast(e.message, true); }
  });
}

/* ---------- 通用模态 ---------- */
let modalCb=null;
function showModal(title, desc, okCb){
  $("#modalTitle").textContent=title; $("#modalDesc").textContent=desc;
  modalCb=okCb; $("#modalMask").classList.add("show");
}
$("#modalCancel").onclick=()=>$("#modalMask").classList.remove("show");
$("#modalMask").addEventListener("click", e=>{ if(e.target===e.currentTarget) $("#modalMask").classList.remove("show"); });
$("#modalOk").onclick=async()=>{ const cb=modalCb; modalCb=null; $("#modalMask").classList.remove("show"); if(cb) cb(); };

/* ---------- 事件绑定 ---------- */
$$("nav button").forEach(b=> b.onclick=()=>switchTab(b.dataset.tab));
$("#menuBtn").onclick=()=>{ showModal("已连接设备", `主机: ${S.host}<br>服务地址: ${location.host}`, null); };
$("#tokenGo").onclick=async()=>{
  const t=$("#tokenInput").value.trim();
  if(!t){ $("#lockErr").textContent="请输入内容"; return; }
  S.token=t; await tryConnect(true);
};
$("#tokenInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#tokenGo").click(); });

$("#cmdGo").onclick=()=>{ const v=$("#cmdInput").value; $("#cmdInput").value=""; execCmd(v); };
$("#cmdInput").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=$("#cmdInput").value; $("#cmdInput").value=""; execCmd(v);} });
$("#quickBtns").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ execCmd(b.dataset.c); } });

$("#pathGo").onclick=()=>{ const p=$("#pathInput").value.trim(); if(p) openDir(p,true); };
$("#pathInput").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const p=$("#pathInput").value.trim(); if(p) openDir(p,true);} });

$("#procGo").onclick=refreshProcs;
$("#procSearch").addEventListener("keydown", e=>{ if(e.key==="Enter") refreshProcs(); });

$("#shotGo").onclick=takeShot;

$$(".power-grid button").forEach(b=> b.onclick=()=>powerClick(b.dataset.a));

// 首次聚焦 token
$("#tokenInput").focus();

/* ---------- 初始化 ---------- */
renderQuick();
window.addEventListener("resize", ()=>{ drawCharts(); });
if(S.token){ tryConnect(true); } else { showLock(); }
</script>
